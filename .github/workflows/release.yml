# 打包安装包并放进 GitHub Release
# 推送 v 开头的标签（如 v0.1.0）时自动运行；也可以在 Actions 页面手动运行（填写要发布的标签）
name: 打包发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签（如 v0.1.0）
        required: true
      mac_only:
        description: 只打包 Mac（Windows 已打好时用）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 手动运行勾选“只打包 Mac”时只留 Mac
        include: ${{ fromJSON(inputs.mac_only && '[{"os":"macos-15-intel","target":"--mac","files":"release/*/*.dmg"}]' || '[{"os":"windows-latest","target":"--win","files":"release/*/*.exe"},{"os":"macos-15-intel","target":"--mac","files":"release/*/*.dmg"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 教学案制作 ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
